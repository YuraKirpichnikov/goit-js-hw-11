<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
    <title>Contact Sheet — Image Search</title>
  </head>
  <body>
    <header class="header">
      <p class="header-eyebrow">Roll no. 001</p>
      <h1 class="header-title">Contact Sheet</h1>
      <p class="header-sub">Search Pixabay's archive and print your own sheet.</p>

      <form class="form" id="search-form">
        <label class="form-label">
          <input
            type="text"
            name="search-text"
            class="form-input"
            placeholder="Search images..."
            autocomplete="off"
            required
          />
        </label>
        <button type="submit" class="form-button">Search</button>
      </form>
    </header>

    <main class="main">
      <div class="loader is-hidden" id="loader" aria-live="polite">
        <span class="loader-dot"></span>
        <span class="loader-dot"></span>
        <span class="loader-dot"></span>
      </div>

      <ul class="gallery" id="gallery"></ul>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
